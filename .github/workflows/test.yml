name: fitview-be-PROD-CI/CD

on:
  push:
    branches: [ "test" ]

env:
  PROD_CORE_WAS_INSTANCE_01_IP: ${{ secrets.TEST_WAS_IP }}

  SERVER_USER: ubuntu

  NCR_REGISTRY_PUBLIC_URI: ${{ secrets.NCR_REGISTRY_PUBLIC_URI }}
  NHN_USER_ACCESS_KEY: ${{ secrets.NHN_USER_ACCESS_KEY }}
  NHN_SECRET_ACCESS_KEY: ${{ secrets.NHN_SECRET_ACCESS_KEY }}
  PROD_NCR_IMAGE_NAME: ${{ secrets.PROD_NCR_IMAGE_NAME }}
  DOCKER_IMAGE_VERSION: latest
  DOCKER_CONTAINER_NAME: backend-prod

  NHN_API_TENANT_ID: ${{ secrets.NHN_API_TENANT_ID }}
  NHN_API_USER_ID: ${{ secrets.NHN_API_USER_ID }}
  NHN_API_PASSWORD: ${{ secrets.NHN_API_PASSWORD }}
  NHN_REGION_NAME: ${{ secrets.NHN_REGION_NAME }}

  PROD_WAS_SSH_KEY: ${{ secrets.PROD_WAS_SSH_KEY }}

  APPLICATION_PROD: ${{ secrets.PROD_APPLICATION_YML }}
  APPLICATION_TEST: ${{ secrets.TEST_APPLICATION_YML }}
  FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}

jobs:
  build-and-push-ncr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Configuration Files
        run: |
          echo "$APPLICATION_PROD" > ./src/main/resources/application.yml
          echo "$APPLICATION_TEST" > ./src/main/resources/application-test.yml
          mkdir -p ./src/main/resources/firebase
          echo "$FIREBASE_KEY" > ./src/main/resources/firebase/firebase-key.json

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Login to NCR
        run: |
          echo "${{ env.NHN_SECRET_ACCESS_KEY }}" | docker login ${{ env.NCR_REGISTRY_PUBLIC_URI }} \
            -u "${{ env.NHN_USER_ACCESS_KEY }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build . -t ${{ env.NCR_REGISTRY_PUBLIC_URI }}/${{ env.PROD_NCR_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_VERSION }}

      - name: Push to NCR
        run: |
          docker push ${{ env.NCR_REGISTRY_PUBLIC_URI }}/${{ env.PROD_NCR_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_VERSION }}

      - name: Deploy to WAS 1 with Rollback Strategy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.PROD_CORE_WAS_INSTANCE_01_IP }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.PROD_WAS_SSH_KEY }}
          script: |
            # ==========================================
            # 1. 환경 변수 설정
            # ==========================================
            CONTAINER_NAME="${{ env.DOCKER_CONTAINER_NAME }}"
            IMAGE_FULL_NAME="${{ env.NCR_REGISTRY_PUBLIC_URI }}/${{ env.PROD_NCR_IMAGE_NAME }}"
            NEW_VERSION="${{ env.DOCKER_IMAGE_VERSION }}"
            BACKUP_TAG="backup"
            PORT=8080
            
            echo "=== [Deploy] Docker Hub 로그인 ==="
            echo "${{ env.NHN_SECRET_ACCESS_KEY }}" | sudo docker login ${{ env.NCR_REGISTRY_PUBLIC_URI }} \
              -u "${{ env.NHN_USER_ACCESS_KEY }}" --password-stdin
            
            echo "=== [Deploy] 새 이미지 Pull ==="
            sudo docker pull $IMAGE_FULL_NAME:$NEW_VERSION
            
            # ==========================================
            # 2. 현재 버전 백업 (Tagging)
            # ==========================================
            echo "=== [Deploy] 현재 실행 중인 이미지 백업 ==="
            if [ "$(sudo docker ps -q -f name=$CONTAINER_NAME)" ]; then
                CURRENT_ID=$(sudo docker inspect --format='{{.Image}}' $CONTAINER_NAME)
                sudo docker tag $CURRENT_ID $IMAGE_FULL_NAME:$BACKUP_TAG
                echo "-> 현재 버전을 백업했습니다: $IMAGE_FULL_NAME:$BACKUP_TAG"
            else
                echo "-> 실행 중인 컨테이너가 없습니다. 백업을 건너뜁니다."
            fi
            
            # ==========================================
            # 3. 기존 컨테이너 삭제 및 새 버전 배포
            # ==========================================
            echo "=== [Deploy] 기존 컨테이너 삭제 ==="
            sudo docker rm -f $CONTAINER_NAME || true
            
            echo "=== [Deploy] 새 컨테이너 생성 (Create) ==="
            sudo docker create --name $CONTAINER_NAME \
              -p $PORT:$PORT -e TZ=Asia/Seoul \
              -v ~/server_logs:/logs \
              $IMAGE_FULL_NAME:$NEW_VERSION
            
            
            echo "=== [Deploy] 컨테이너 시작 (Start) ==="
            sudo docker start $CONTAINER_NAME
            
            # ==========================================
            # 4. 반복 헬스 체크 (Retry Loop)
            # ==========================================
            echo "=== [Health Check] 서비스 상태 확인 시작 (5초 간격, 최대 20회) ==="
            
            RETRIES=0
            MAX_RETRIES=20   # 5초 * 20회 = 100초
            SUCCESS="false"
            
            while [ $RETRIES -lt $MAX_RETRIES ]; do
                RETRIES=$((RETRIES+1))
                echo "Checking health... ($RETRIES/$MAX_RETRIES)"
                sleep 5
            
                # 헬스 체크 요청 (단순 200 OK 확인)
                # 만약 스프링 Actuator라면 주소를 /actuator/health 로 변경하세요
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$PORT/health || echo "000")
            
                if [ "$HTTP_CODE" == "200" ]; then
                    echo "✅ [Success] 서버가 정상적으로 응답합니다! (HTTP 200)"
                    SUCCESS="true"
                    break
                fi
            done
            
            # ==========================================
            # 5. 결과 처리 (성공 or 롤백)
            # ==========================================
            if [ "$SUCCESS" == "true" ]; then
                # 성공 시 정리 작업
                sudo docker image prune -f
                sudo docker logout ${{ env.NCR_REGISTRY_PUBLIC_URI }}
                rm ~/application.yml
                rm -rf ~/firebase
                exit 0
            else
                echo "❌ [Fail] 100초 동안 서버가 응답하지 않습니다. (Last Code: $HTTP_CODE)"
                echo "롤백 프로세스를 시작합니다..."
            
                # ------------------------------------------
                # 롤백 프로세스 시작
                # ------------------------------------------
                echo "=== [Rollback] 실패한 컨테이너 삭제 ==="
                sudo docker rm -f $CONTAINER_NAME
            
                echo "=== [Rollback] 백업 이미지로 복구 시작 ==="
                sudo docker create --name $CONTAINER_NAME \
                  -p $PORT:$PORT -e TZ=Asia/Seoul \
                  -v ~/server_logs:/logs \
                  $IMAGE_FULL_NAME:$BACKUP_TAG
            
                sudo docker start $CONTAINER_NAME
            
                echo "🔄 [Rollback] 롤백 완료. 이전 버전이 실행 중입니다."
            
                # GitHub Actions를 실패로 마킹
                exit 1
            fi

