#해당 파일 이름(의미X)
name: fitview-be-dev-CI/CD

#on : 어떤 경우에 깃허브 액션을 실행할지 정함
#(아래는 push 발생 시, 깃허브 액션을 수행. 즉, 아래 명령어들 실행)
on:
  push:
    branches: [ "develop" ]

# env : 변수 선언
# ex) DOCKER_IMAGE_NAME = testimage
env:
  SERVER_HOST: ${{ secrets.STAGE_SERVER_HOST }}
  SERVER_HOST_NAME : ubuntu
  SERVER_SSH_PRIVATE_KEY: ${{ secrets.STAGE_SERVER_SSH_PRIVATE_KEY }}

  DOCKER_IMAGE_NAME: fitview-be
  DOCKER_IMAGE_VERSION: latest
  DOCKER_NAME: ${{ secrets.STAGE_DOCKER_NAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.STAGE_DOCKER_HUB_TOKEN }}
  DOCKER_CONTAINER_NAME: backend

  APPLICATION_PROD: ${{ secrets.STAGE_APPLICATION_YML }}
  APPLICATION_TEST: ${{ secrets.TEST_APPLICATION_YML }}

  FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}

  FULL_GITHUB_SHA: ${{ github.sha }}
  SHORT_GITHUB_SHA: 0


# jobs : 수행할 명령어
# jobs를 여러개 써도 됨
# (하지만 각 jobs는 독립적으로 수행되므로, Ajobs의 진행 상황이 Bjobs에는 반영 안됨)
jobs:

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up config files for test
        run: |
          echo "${{ env.APPLICATION_TEST }}" > ./src/main/resources/application-test.yml

      - name: Grant execute permission for gradlew
        run: sudo chmod +x ./gradlew

      - name: Run Tests ONLY
        run: ./gradlew test

  build-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up config files for build
        run: |
          echo "${{ env.APPLICATION_PROD }}" > ./src/main/resources/application.yml

      - name: Grant execute permission for gradlew
        run: sudo chmod +x ./gradlew

      - name: Build JAR without tests
        run: ./gradlew build -x test

      # 생성된 JAR 파일을 임시 저장소에 업로드 (트랙 C로 넘겨주기 위함)
      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-app-jar
          path: build/libs/*.jar

  # jobs 이름
  deploy-docker:
    needs: [run-tests, build-jar]
    runs-on: ubuntu-latest
    steps:

      # 해당 step의 이름(Checkout)
      - name: Checkout
        # 현재 리포지토리 코드 가져오기
        uses: actions/checkout@v4

      # FULL_GITHUB_SHA의 7글자만 SHORT_GITHUB_SHA에 첨가
      - name: Set SHORT_GITHUB_SHA
        run: echo "SHORT_GITHUB_SHA=${FULL_GITHUB_SHA::7}" >> $GITHUB_ENV
      # template로 실제 docker-compose.yml 생성
      - name: Generate docker-compose.yml from template
        run: envsubst < docker-compose.yml.template > docker-compose.yml
        env:
          DOCKER_NAME: ${{ env.DOCKER_NAME }}
          DOCKER_IMAGE_NAME: ${{ env.DOCKER_IMAGE_NAME }}
          DOCKER_CONTAINER_NAME: ${{ env.DOCKER_CONTAINER_NAME }}

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: spring-app-jar
          path: build/libs/


      # 해당 프로젝트를 도커 이미지로 만듦
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_VERSION }}

      # 도커 허브에 접속
      - name: Login to Docker Hub using Access Token
        run: echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_NAME" --password-stdin

      # 도커 허브에 해당 도커 이미지 저장
      - name: Push the Docker image
        run: |
          docker image tag ${{ env.DOCKER_IMAGE_NAME }} ${{ env.DOCKER_NAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_VERSION }}
          docker image tag ${{ env.DOCKER_IMAGE_NAME }} ${{ env.DOCKER_NAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.SHORT_GITHUB_SHA }}
          docker push ${{ env.DOCKER_NAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_VERSION }}
          docker push ${{ env.DOCKER_NAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.SHORT_GITHUB_SHA }}
      # 1. 서버 접속
      # 2. 이미 실행중인 해당 프로젝트의 도커 컨테이너와 이미지 삭제
      # 3. 도커 허브에서 저장한 이미지 가져옴
      # 4. 이미지를 컨테이너로 만들어서 실행
      # [수정됨] 배포 및 롤백 자동화 스크립트 적용
      # [수정됨] 배포 및 롤백 자동화 스크립트 (Health Check 반복문 적용)
      - name: Deploy with Rollback Strategy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_HOST_NAME }}
          key: ${{ env.SERVER_SSH_PRIVATE_KEY }}
          script: |
            # ==========================================
            # 1. 변수 및 환경 설정
            # ==========================================
            CONTAINER_NAME="${{ env.DOCKER_CONTAINER_NAME }}"
            # 이미지 이름 조합 (Docker Hub 계정 / 이미지 이름)
            IMAGE_FULL_NAME="${{ env.DOCKER_NAME }}/${{ env.DOCKER_IMAGE_NAME }}"
            NEW_VERSION="${{ env.DOCKER_IMAGE_VERSION }}"
            BACKUP_TAG="backup"
            PORT="8080"

            echo "=== [Deploy] Docker Hub 로그인 ==="
            echo "${{ env.DOCKER_HUB_TOKEN }}" | sudo docker login -u "${{ env.DOCKER_NAME }}" --password-stdin

            echo "=== [Deploy] 새 이미지 Pull ==="
            sudo docker pull $IMAGE_FULL_NAME:$NEW_VERSION

            # ==========================================
            # 2. 현재 버전 백업 (Tagging)
            # ==========================================
            echo "=== [Deploy] 현재 실행 중인 이미지 백업 ==="
            if [ "$(sudo docker ps -q -f name=$CONTAINER_NAME)" ]; then
                CURRENT_ID=$(sudo docker inspect --format='{{.Image}}' $CONTAINER_NAME)
                # 현재 실행 중인 이미지 ID에 'backup' 태그를 붙임
                sudo docker tag $CURRENT_ID $IMAGE_FULL_NAME:$BACKUP_TAG
                echo "-> 현재 버전을 백업했습니다: $IMAGE_FULL_NAME:$BACKUP_TAG"
            else
                echo "-> 실행 중인 컨테이너가 없습니다. 백업을 건너뜁니다."
            fi

            # ==========================================
            # 3. 기존 컨테이너 중지/삭제 및 새 버전 실행
            # ==========================================
            echo "=== [Deploy] 기존 컨테이너 삭제 ==="
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true

            echo "=== [Deploy] 새 버전 컨테이너 실행 ==="
            sudo docker run -d \
              --name $CONTAINER_NAME \
              -p $PORT:$PORT \
              $IMAGE_FULL_NAME:$NEW_VERSION

            # ==========================================
            # 4. 반복 헬스 체크 (Retry Loop)
            # ==========================================
            echo "=== [Health Check] 서비스 상태 확인 시작 (5초 간격, 최대 20회) ==="
            
            RETRIES=0
            MAX_RETRIES=20   # 5초 * 20회 = 100초
            SUCCESS="false"

            while [ $RETRIES -lt $MAX_RETRIES ]; do
                RETRIES=$((RETRIES+1))
                echo "Checking health... ($RETRIES/$MAX_RETRIES)"
                sleep 5

                # 헬스 체크 요청 (/health 엔드포인트가 없으면 메인 페이지 등으로 변경)
                # curl이 실패해도 스크립트가 중단되지 않도록 || echo "000" 처리
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$PORT/health || echo "000")

                if [ "$HTTP_CODE" == "200" ]; then
                    echo "✅ [Success] 서버가 정상적으로 응답합니다! (HTTP 200)"
                    SUCCESS="true"
                    break
                fi
            done

            # ==========================================
            # 5. 결과 처리 (성공 or 롤백)
            # ==========================================
            if [ "$SUCCESS" == "true" ]; then
                echo "=== [Deploy] 배포 성공 마무리 작업 ==="
                sudo docker image prune -f
                sudo docker logout
                exit 0
            else
                echo "❌ [Fail] 100초 동안 서버가 응답하지 않습니다. (Last Code: $HTTP_CODE)"
                echo "롤백 프로세스를 시작합니다..."

                # ------------------------------------------
                # 롤백 프로세스
                # ------------------------------------------
                echo "=== [Rollback] 실패한 컨테이너 삭제 ==="
                sudo docker stop $CONTAINER_NAME
                sudo docker rm $CONTAINER_NAME

                echo "=== [Rollback] 백업 이미지로 복구 시작 ==="
                sudo docker run -d \
                  --name $CONTAINER_NAME \
                  -p $PORT:$PORT \
                  $IMAGE_FULL_NAME:$BACKUP_TAG

                echo "🔄 [Rollback] 롤백 완료. 이전 버전이 실행 중입니다."
                sudo docker logout
            
                # GitHub Actions를 실패로 마킹
                exit 1
            fi
